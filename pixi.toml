[workspace]
authors = ["seanfuruta <sean.furuta@berkeley.edu>"]
channels = ["conda-forge"]
name = "czn_agent"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[feature.cznagent]
channels = ["pytorch", "nvidia", "conda-forge", "main", "r", "msys2"]

[feature.cznagent.dependencies]
python = "3.10.*"
pytorch = "*"
torchvision = "*"
pytorch-cuda = "11.8.*"
pip = "*"
matplotlib = ">=3.10.9,<4"
timm = ">=1.0.27,<2"
# Note: Standard opencv is completely removed from this section

[feature.cznagent.pypi-dependencies]
opencv-python-headless = "*"  # Added safely via PyPI here
ultralytics = "*"
yt-dlp = "*"
gymnasium = "*"
streamlit = "*"

[environments]
cznagent = { features = ["cznagent"], no-default-feature = true }

[dependencies]
timm = ">=1.0.27,<2"
